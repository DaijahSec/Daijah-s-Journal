<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — a private journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1b1918;
    --paper: #f2ede1;
    --paper-dim: #e8e1d1;
    --blue: #3b4a6b;
    --blue-dim: #57699254;
    --muted: #8a8579;
    --line: #d8d0bd;
    --error: #a13d3d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Source Serif 4', serif;
    min-height: 100vh;
  }

  .shell {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 120px;
  }

  header.site {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 48px;
    border-bottom: 1px solid #3a3733;
    padding-bottom: 20px;
  }

  header.site h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0;
  }

  header.site .who {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  header.site .who button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-left: 10px;
  }
  header.site .who button:hover { color: var(--paper); }

  /* --- Auth screen --- */
  .auth-card {
    max-width: 380px;
    margin: 80px auto;
    padding: 40px 32px;
    background: var(--paper);
    color: var(--ink);
  }

  .auth-card h2 {
    font-size: 19px;
    margin: 0 0 6px;
  }

  .auth-card p.sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: #6b665a;
    margin: 0 0 28px;
  }

  label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #6b665a;
    margin-bottom: 6px;
  }

  input[type="email"], input[type="password"], textarea {
    width: 100%;
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    margin-bottom: 20px;
    color: var(--ink);
  }
  input:focus, textarea:focus {
    outline: none;
    border-bottom: 1px solid var(--blue);
  }

  button.primary {
    width: 100%;
    background: var(--blue);
    color: var(--paper);
    border: none;
    padding: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary:hover { background: #2e3a56; }
  button.primary:disabled { opacity: 0.5; cursor: default; }

  .toggle-mode {
    text-align: center;
    margin-top: 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .toggle-mode button {
    background: none; border: none; color: var(--blue);
    text-decoration: underline; cursor: pointer; font: inherit;
  }

  .msg {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    margin-bottom: 16px;
  }
  .msg.error { color: var(--error); }
  .msg.ok { color: #3d6b47; }

  /* --- Composer --- */
  .composer {
    margin-bottom: 56px;
  }

  .composer .date-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .composer input[type="text"] {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--paper);
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 600;
    padding: 0 0 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #3a3733;
  }
  .composer input[type="text"]::placeholder { color: #4d4a44; }
  .composer input[type="text"]:focus { outline: none; border-bottom-color: var(--blue); }

  .composer textarea.entry-body {
    width: 100%;
    min-height: 140px;
    background: transparent;
    border: none;
    color: var(--paper);
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    line-height: 1.65;
    resize: vertical;
    padding: 0;
  }
  .composer textarea.entry-body::placeholder { color: #4d4a44; }
  .composer textarea.entry-body:focus { outline: none; }

  .composer-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
  }

  .composer-footer .hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-right: auto;
  }

  button.save {
    background: var(--blue);
    color: var(--paper);
    border: none;
    padding: 10px 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    cursor: pointer;
  }
  button.save:hover { background: #2e3a56; }
  button.save:disabled { opacity: 0.5; cursor: default; }

  /* --- Entries list --- */
  .entries { display: flex; flex-direction: column; gap: 0; }

  .entry {
    padding: 28px 0;
    border-top: 1px solid #3a3733;
  }
  .entry:last-child { border-bottom: 1px solid #3a3733; }

  .entry .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .entry .date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .entry .delete {
    background: none; border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .entry:hover .delete { opacity: 1; }
  .entry .delete:hover { color: var(--error); }

  .entry h3 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 8px;
  }

  .entry .body {
    font-size: 16px;
    line-height: 1.7;
    color: #ddd5c3;
    white-space: pre-wrap;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div id="app" class="shell"></div>

<script>
  // ── CONFIGURE ME ────────────────────────────────────────────────
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  // ────────────────────────────────────────────────────────────────

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById("app");

  let session = null;
  let authMode = "sign_in"; // or "sign_up"
  let authMsg = null;

  sb.auth.onAuthStateChange((_event, s) => {
    session = s;
    render();
  });

  async function init() {
    const { data } = await sb.auth.getSession();
    session = data.session;
    render();
  }

  function fmtDate(iso) {
    return new Date(iso).toLocaleString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric',
      year: 'numeric', hour: 'numeric', minute: '2-digit'
    });
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;
    authMsg = null;
    const btn = document.getElementById("auth-submit");
    btn.disabled = true;
    btn.textContent = "working...";

    let result;
    if (authMode === "sign_in") {
      result = await sb.auth.signInWithPassword({ email, password });
    } else {
      result = await sb.auth.signUp({ email, password });
    }

    if (result.error) {
      authMsg = { type: "error", text: result.error.message };
      render();
      return;
    }

    if (authMode === "sign_up" && !result.data.session) {
      authMsg = { type: "ok", text: "Check your email to confirm your account, then sign in." };
      authMode = "sign_in";
      render();
      return;
    }

    session = result.data.session;
    render();
  }

  async function handleSignOut() {
    await sb.auth.signOut();
    session = null;
    render();
  }

  let entries = [];
  let loadingEntries = false;

  async function loadEntries() {
    loadingEntries = true;
    render();
    const { data, error } = await sb
      .from("entries")
      .select("*")
      .order("created_at", { ascending: false });
    loadingEntries = false;
    if (!error) entries = data;
    render();
  }

  async function handleSave() {
    const titleEl = document.getElementById("entry-title");
    const bodyEl = document.getElementById("entry-body");
    const title = titleEl.value.trim();
    const body = bodyEl.value.trim();
    if (!body) return;

    const btn = document.getElementById("save-btn");
    btn.disabled = true;
    btn.textContent = "saving...";

    const { error } = await sb.from("entries").insert({
      user_id: session.user.id,
      title: title || null,
      body: body
    });

    if (!error) {
      titleEl.value = "";
      bodyEl.value = "";
      await loadEntries();
    } else {
      alert("Couldn't save: " + error.message);
      btn.disabled = false;
      btn.textContent = "Save entry";
    }
  }

  async function handleDelete(id) {
    if (!confirm("Delete this entry? This can't be undone.")) return;
    await sb.from("entries").delete().eq("id", id);
    await loadEntries();
  }

  function renderAuth() {
    app.innerHTML = `
      <div class="auth-card">
        <h2>Ledger</h2>
        <p class="sub">a private, single-reader journal</p>
        ${authMsg ? `<div class="msg ${authMsg.type}">${authMsg.text}</div>` : ""}
        <form id="auth-form">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" required autocomplete="email">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
          <button type="submit" class="primary" id="auth-submit">
            ${authMode === "sign_in" ? "Sign in" : "Create account"}
          </button>
        </form>
        <div class="toggle-mode">
          ${authMode === "sign_in"
            ? `New here? <button id="toggle-auth">Create an account</button>`
            : `Already have an account? <button id="toggle-auth">Sign in</button>`}
        </div>
      </div>
    `;
    document.getElementById("auth-form").addEventListener("submit", handleAuthSubmit);
    document.getElementById("toggle-auth").addEventListener("click", () => {
      authMode = authMode === "sign_in" ? "sign_up" : "sign_in";
      authMsg = null;
      render();
    });
  }

  function renderJournal() {
    const today = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });

    app.innerHTML = `
      <header class="site">
        <h1>Ledger</h1>
        <div class="who">${session.user.email}<button id="signout">sign out</button></div>
      </header>

      <div class="composer">
        <div class="date-label">${today}</div>
        <input type="text" id="entry-title" placeholder="Title (optional)">
        <textarea id="entry-body" class="entry-body" placeholder="Write what's on your mind..."></textarea>
        <div class="composer-footer">
          <span class="hint">Only you can read this.</span>
          <button class="save" id="save-btn">Save entry</button>
        </div>
      </div>

      <div class="entries" id="entries-list">
        ${loadingEntries ? `<div class="empty-state">loading entries...</div>` : renderEntriesHtml()}
      </div>
    `;

    document.getElementById("signout").addEventListener("click", handleSignOut);
    document.getElementById("save-btn").addEventListener("click", handleSave);

    entries.forEach(entry => {
      const delBtn = document.getElementById("del-" + entry.id);
      if (delBtn) delBtn.addEventListener("click", () => handleDelete(entry.id));
    });
  }

  function renderEntriesHtml() {
    if (entries.length === 0) {
      return `<div class="empty-state">No entries yet. Write your first one above.</div>`;
    }
    return entries.map(entry => `
      <div class="entry">
        <div class="meta">
          <span class="date">${fmtDate(entry.created_at)}</span>
          <button class="delete" id="del-${entry.id}">delete</button>
        </div>
        ${entry.title ? `<h3>${escapeHtml(entry.title)}</h3>` : ""}
        <div class="body">${escapeHtml(entry.body)}</div>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    if (!session) {
      renderAuth();
    } else {
      renderJournal();
      if (entries.length === 0 && !loadingEntries) loadEntries();
    }
  }

  init();
</script>
</body>
</html>
